name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Systempakete (ffmpeg + Qt ohne Bildschirm)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0

      - name: Bibliotheken
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyflakes

      - name: Code-Prüfung
        run: python -m pyflakes bub3tagmusic tests

      - name: Alle Tests
        env:
          PYTHON: python
          SHOTS: ${{ github.workspace }}/screenshots
        run: tests/run_all.sh

      - name: Screenshots hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-py${{ matrix.python }}
          path: screenshots/
          if-no-files-found: ignore

  appimage:
    name: AppImage bauen und prüfen
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Absichtlich OHNE libxcb-cursor0 & Co. – so wird geprüft, dass das AppImage sie selbst mitbringt
      - name: Systempakete (ffmpeg, virtueller Bildschirm)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg xvfb libegl1 libgl1 libfontconfig1 libdbus-1-3 libglib2.0-0

      - name: AppImage bauen (make)
        run: make

      - name: Selbsttest auf einem echten X-Bildschirm
        run: |
          pip install -q mutagen Pillow
          python tests/make_testfiles.py /tmp/bub3data --collection 6
          Xvfb :99 -screen 0 1366x768x24 &
          sleep 2
          out=$(DISPLAY=:99 BUB3_DEBUG=1 APPIMAGE_EXTRACT_AND_RUN=1 dist/*.AppImage --selftest /tmp/bub3data/Musik 2>&1)
          echo "$out"
          echo "$out" | grep -q "SELFTEST OK"

      - name: AppImage zum Herunterladen bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: BuB3TAGMUSIC-AppImage
          path: dist/*.AppImage
          retention-days: 60
          compression-level: 0

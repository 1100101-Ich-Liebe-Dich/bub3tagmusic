name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Systempakete (ffmpeg + Qt ohne Bildschirm)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0

      - name: Bibliotheken
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyflakes

      - name: Code-Prüfung
        run: python -m pyflakes bub3tagmusic tests

      - name: Alle Tests
        env:
          PYTHON: python
          SHOTS: ${{ github.workspace }}/screenshots
        run: tests/run_all.sh

      - name: Screenshots hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-py${{ matrix.python }}
          path: screenshots/
          if-no-files-found: ignore

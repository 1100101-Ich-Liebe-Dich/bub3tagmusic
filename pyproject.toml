[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bub3tagmusic"
version = "1.1.5"
description = "Moderner, schneller Musik-Tagger für Linux – präsentiert von www.BAUENUNDBOOTEN.de"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = [
    "PySide6-Essentials>=6.8,<6.11; python_version < '3.12'",
    "PySide6-Essentials>=6.8; python_version >= '3.12'",
    "mutagen>=1.47",
    "Pillow>=10.0",
    "qtawesome>=1.3",
    "certifi>=2023.7",
]

[project.gui-scripts]
bub3tagmusic = "bub3tagmusic.app:run"

[tool.setuptools.packages.find]
include = ["bub3tagmusic*"]

[tool.setuptools.package-data]
bub3tagmusic = ["resources/*", "resources/fonts/*", "resources/export/*"]
